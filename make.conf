# /etc/portage/make.conf
# OpenRC + Wayfire | Ryzen 9 5950X | 32GB RAM | RX 7900 XTX | NVMe + XFS
# Target Profile: default/linux/amd64/23.0/desktop (OpenRC)

# ============================================
# COMPILER (Zen 3 Vermeer)
# ============================================

COMMON_FLAGS="-O2 -pipe -march=znver3 -mtune=znver3"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

MAKEOPTS="-j32 -l32"

CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# ============================================
# BUILD FEATURES
# ============================================

FEATURES="parallel-fetch parallel-install candy buildpkg"
PKGDIR="/var/cache/binpkgs"

# Skip docs/manpages to reduce install I/O (not TRIM, just cleaner)
FEATURES="${FEATURES} nodoc noinfo noman"

# ============================================
# USE FLAGS (Wayland-native, OpenRC)
# ============================================

USE="
    wayland
    -X
    xwayland
    elogind
    -systemd
    -consolekit
    pipewire
    pulseaudio
    alsa
    vaapi
    vdpau
    vulkan
    opengl
    gles2
    egl
    dbus
    udev
    evdev
    libinput
    wlr
    icu
    jpeg
    png
    svg
    tiff
    webp
    truetype
    fontconfig
    freetype
    harfbuzz
    cairo
    pango
    gtk
    gtk3
    gtk4
    introspection
    notification
    libnotify
    screencast
    screenshots
    wayland-scanner
    xkb
    xkbcommon
    opencl
    -gnome
    -kde
    -qt5
    -qt6
    -telemetry
    -debug
    -doc
    -examples
    -test
"

# ============================================
# GPU / INPUT (RX 7900 XTX RDNA3)
# ============================================

VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput keyboard mouse"

# ============================================
# LOCALE
# ============================================

LINGUAS="en"
L10N="en"
LC_MESSAGES=C.UTF-8

# ============================================
# LICENSE
# ============================================

ACCEPT_LICENSE="-* @FREE"
# ACCEPT_LICENSE="* -@EULA"

# ============================================
# EMERGE BEHAVIOR
# ============================================

EMERGE_DEFAULT_OPTS="--verbose --keep-going --with-bdeps=y --complete-graph"

# ============================================
# MIRRORS — Sweden
# ============================================

GENTOO_MIRRORS="
    https://ftp.lysator.liu.se/gentoo/
    http://ftp.lysator.liu.se/gentoo/
    ftp://ftp.lysator.liu.se/gentoo/
    rsync://ftp.lysator.liu.se/gentoo/
    https://mirrors.tnonline.net/gentoo/gentoo-distfiles/
    rsync://mirrors.tnonline.net/gentoo-distfiles
"

# ============================================
# INTERPRETERS
# ============================================

PYTHON_TARGETS="python3_12"
PYTHON_SINGLE_TARGET="python3_12"
RUBY_TARGETS="ruby31"

# ============================================
# WLROOTS / WAYFIRE BACKENDS
# ============================================

WLR_BACKENDS="drm libinput"
WLR_RENDERERS="gles2 vulkan pixman"
