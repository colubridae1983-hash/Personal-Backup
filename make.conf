# =============================================================
# /etc/portage/make.conf
# Gentoo Linux — AMD Ryzen 9 5950X + RX 7900 XTX
# Hyprland Minimal Gaming & AI Workstation
# =============================================================

# ── Compiler Flags ────────────────────────────────────────────
COMMON_FLAGS="-march=znver3 -mtune=znver3 -O3 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=znver3 -C opt-level=3"

# ── Parallelism ───────────────────────────────────────────────
MAKEOPTS="-j16 -l30"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=30 --keep-going --with-bdeps=y"

# ── CPU ISA Flags ─────────────────────────────────────────────
CPU_FLAGS_X86="aes avx avx2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"

# ── ABI — Multilib (Required for Steam) ───────────────────────
ABI_X86="32 64"

GRUB_PLATFORMS="efi-64"
# ── GPU / Input ───────────────────────────────────────────────
VIDEO_CARDS="amdgpu radeonsi radv"
INPUT_DEVICES="libinput"

# ── Global USE Flags ──────────────────────────────────────────
# Base: Wayland native, seat management, audio, and pipewire
# Hardware/Gaming: Vulkan, Gamescope/Gamemode support, explicit XWayland for compatibility
# AI: ROCm and HIP targets for the 7900 XTX

USE="X dbus udisks polkit networkmanager vulkan gamemode opengl opencl offload rocm systemd hip wayland xwayland pipewire alsa pulseaudio sound-server qt6 gtk webengine -gnome -cups -qt5 -kde -plasma udev policykit jpeg png webp gif tiff svg brotli gdbm accessibility gtk qt6 egl gbm"

# ── Licensing ──────────────────────────────────────────

ACCEPT_LICENSE="*"

ACCEPT_KEYWORDS="~amd64"

# ── Locale ────────────────────────────────────────────────────

L10N="en en-US"

LINGUAS="en en_US"

# ── Portage Features & Binaries ───────────────────────────────

FEATURES="parallel-fetch parallel-install candy split-elog ccache"

# ── Python & Fonts ────────────────────────────────────────────

# PYTHON_TARGETS="python3_12 python3_11 python3_13 python3_14"
PYTHON_TARGETS="python3_12 python3_13"
PYTHON_SINGLE_TARGET="python3_12"

NERD_FONTS="Mononoki Nerd Font "

# ── Hardware Targets (LLVM & ROCm AI) ─────────────────────────

LLVM_TARGETS="X86 AMDGPU"
AMDGPU_TARGETS="gfx1100"
ROCM_TARGETS="gfx1100"
# ── Directories & Logging ─────────────────────────────────────

PORTDIR="/var/db/repos/gentoo"

DISTDIR="/var/cache/distfiles"

PKGDIR="/var/cache/binpkgs"

CCACHE_DIR="/var/cache/ccache"

PORTAGE_ELOG_CLASSES="log warn error"

PORTAGE_ELOG_SYSTEM="save"

GENTOO_MIRRORS="https://ftp.lysator.liu.se/gentoo/ https://mirrors.tnonline.net/gentoo/gentoo-distfiles/"
